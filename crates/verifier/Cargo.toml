[package]
name = "cv-verifier"
description = "Small independent verifier: recomputes any result from a Log snapshot and Bitcoin headers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cv_verifier"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cv-verifier"
path = "src/main.rs"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
cv-core.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
rand_chacha.workspace = true
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
cv-crypto.workspace = true

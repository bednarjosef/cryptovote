[package]
name = "cv-client"
description = "Participant library (UniFFI) and CLI wrapper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cv_client"
path = "src/lib.rs"

[[bin]]
name = "cv-client"
path = "src/main.rs"

[features]
default = ["tor", "ffi"]
tor = ["dep:arti-client", "dep:tor-rtcompat", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
ffi = ["dep:uniffi"]

[dependencies]
cv-core.workspace = true
cv-crypto.workspace = true
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
tokio.workspace = true
rand.workspace = true
rand_chacha.workspace = true
ark-ff.workspace = true
arti-client = { workspace = true, optional = true }
tor-rtcompat = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/crypto",
    "crates/log",
    "crates/node",
    "crates/client",
    "crates/verifier",
    "crates/issuer",
    "crates/sim",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# Every third-party crate is listed here with a pinned version.
# The reason for each choice is in DEPENDENCIES.md.
[workspace.dependencies]
cv-core = { path = "crates/core" }
cv-crypto = { path = "crates/crypto" }
cv-log = { path = "crates/log" }
cv-client = { path = "crates/client" }
cv-verifier = { path = "crates/verifier" }

# --- cryptographic primitives (Hard rule 1: never implemented here) ---
blake3 = "1.8"
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-ec = "0.6"
ark-std = "0.6"
ark-serialize = "0.6"
ark-relations = "0.6"
ark-r1cs-std = "0.6"
ark-snark = "0.6"
ark-groth16 = "0.6"
ark-crypto-primitives = { version = "0.6", features = ["crh", "merkle_tree", "sponge", "constraints"] }
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rs_merkle = "1.5"
bitcoin = "0.32"
opentimestamps = "0.2"
sphinx-packet = "0.7"
rand = "0.8"
rand_chacha = "0.3"

# --- to be wired in later phases (versions verified 2026-09-03) ---
# arti-client = "0.46"        # Phase 7
# tor-rtcompat = "0.46"       # Phase 7
# uniffi = "0.32"             # Phase 7 (client bindings)
# wasm-bindgen = "0.2"        # Phase 8
# axum = "0.8"                # Phase 4
# reqwest = "0.13"            # Phase 4/5
# tokio = "1"                 # Phase 4
# redb = "4"                  # Phase 4
# electrum-client = "0.25"    # Phase 5 (optional header source)

# --- general ---
thiserror = "2"
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"

[profile.release]
opt-level = 3

# Optimize dependencies (arkworks, blake3, …) even in dev/test builds; the
# workspace crates themselves stay unoptimized for fast incremental builds.
[profile.dev.package."*"]
opt-level = 3
